name: Build Livox 3D Scanner APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compile Debug APK (Auto-detect folder & force AndroidX)
        run: |
          if [ -d "LivoxScannerApp" ]; then
            cd LivoxScannerApp
          fi
          gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Livox-Mid40-Scanner-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
